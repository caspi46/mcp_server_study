[package]
name = "repo_analyst_mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "0.12.0", features = [
    "server",
    "transport-streamable-http-server",
] }
anyhow = "1.0"
axum = "0.8.8"
schemars = "1.2.0"
serde = { version = "1.0", features = ["dervie"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal"] }
